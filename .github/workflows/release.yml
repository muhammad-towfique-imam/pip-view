name: Build and release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webcam-view-pip-windows
          path: rust/target/release/webcam-view-pip.exe

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      # The passphrase of android/keystore-backup/webcam-view-pip-key.enc (the release key).
      WEBCAMVIEWPIP_KEY_PASSPHRASE: ${{ secrets.WEBCAMVIEWPIP_KEY_PASSPHRASE }}
      # The SHA-256 of the release certificate. A release APK with another signer stops the release.
      SIGNER: fd5a376ac527c757f975f9897effbe116811d2eca6b7fdfa7796c5e97158cbe3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # A release APK without the release key cannot update an installed copy.
      - name: Require the release key for a release
        if: startsWith(github.ref, 'refs/tags/v') && env.WEBCAMVIEWPIP_KEY_PASSPHRASE == ''
        run: |
          echo "::error::The secret WEBCAMVIEWPIP_KEY_PASSPHRASE is missing. Without it the APK is not signed."
          exit 1

      - name: Test, lint, and build
        run: ./gradlew --no-daemon -p buildSrc test && ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Check the APK signer
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if ! "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -q "SHA-256 digest: $SIGNER"; then
            echo "::error::The APK is not signed with the release key."
            exit 1
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release*.apk webcam-view-pip.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webcam-view-pip-android
          path: android/webcam-view-pip.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            webcam-view-pip.exe
            webcam-view-pip.apk
          generate_release_notes: true
