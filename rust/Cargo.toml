[package]
name = "webcam-view-pip"
version = "0.4.0"
edition = "2021"
description = "PiP camera for Windows: a picture-in-picture webcam window that stays on top and shows a selected area of the camera"
license = "MIT"
repository = "https://github.com/muhammad-towfique-imam/webcam-view-pip"
keywords = ["pip", "picture-in-picture", "webcam", "camera", "windows"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Media_MediaFoundation",
    "Win32_Media_KernelStreaming",
] }

[build-dependencies]
embed-manifest = "1.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
