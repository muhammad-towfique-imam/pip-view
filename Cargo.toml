[package]
name = "pip-view"
version = "0.1.0"
edition = "2021"
description = "Picture-in-picture view of a selected area of a camera image"

[dependencies]
eframe = "0.37"
nokhwa = { version = "0.10", features = ["input-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
