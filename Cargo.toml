[package]
name = "webcam-view-pip"
version = "0.2.0"
edition = "2021"
description = "PiP camera for Windows: a picture-in-picture webcam window that stays on top and shows a selected area of the camera"
license = "MIT"
repository = "https://github.com/muhammad-towfique-imam/webcam-view-pip"
keywords = ["pip", "picture-in-picture", "webcam", "camera", "windows"]

[dependencies]
eframe = "0.37"
nokhwa = { version = "0.10", features = ["input-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
